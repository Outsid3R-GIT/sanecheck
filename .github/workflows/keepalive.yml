name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: SaneCheck on sanelabs.dev must answer
        run: curl -fsS --max-time 60 https://sanecheck.sanelabs.dev/health
      - name: Keep the old Render instance warm (best effort)
        run: curl -fsS --max-time 60 https://sanecheck.onrender.com/health || true
