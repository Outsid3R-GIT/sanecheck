# Keeps the free-tier Render instance from spinning down (idle spin-down wipes the
# in-container SQLite: runs + schema baselines). Runs every 5 minutes; free on public repos.
name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://sanecheck.onrender.com/health || true
